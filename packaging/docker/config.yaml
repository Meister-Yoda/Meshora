server_url: http://127.0.0.1:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090

noise:
  private_key_path: /var/lib/meshora/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

database:
  type: sqlite
  sqlite:
    path: /var/lib/meshora/db.sqlite
    write_ahead_log: true

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: false

dns:
  magic_dns: true
  base_domain: meshora.internal
  override_local_dns: false

log:
  level: info
  format: text

policy:
  mode: database

unix_socket: /var/run/meshora/meshora.sock
unix_socket_permission: "0770"

web_admin:
  enabled: true
  session_ttl: 12h

disable_check_updates: true
