services:
  meshora:
    image: ${MESHORA_IMAGE:-ghcr.io/meister-yoda/meshora}:${MESHORA_VERSION:-v0.1.0-rc.4}
    restart: unless-stopped
    ports:
      - "${MESHORA_BIND_IP:-0.0.0.0}:${MESHORA_PORT:-8080}:8080"
    volumes:
      - meshora-config:/etc/meshora
      - meshora-data:/var/lib/meshora
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/meshora
    healthcheck:
      test: ["CMD", "/usr/local/bin/headscale", "health", "--http", "--config", "/etc/meshora/config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  meshora-config:
  meshora-data:
